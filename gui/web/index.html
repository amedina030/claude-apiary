<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="vendor/xterm/xterm.min.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <div id="handoff-banner" class="handoff-banner hidden" role="status" aria-live="polite">
        <span id="handoff-banner-text" class="handoff-banner-text"></span>
        <button id="handoff-banner-btn" type="button" class="handoff-banner-btn">Ask Claude to /backfill-handoffs</button>
        <button id="handoff-banner-dismiss" type="button" class="handoff-banner-dismiss" aria-label="dismiss">×</button>
      </div>
      <nav id="tabs" class="tabs" aria-label="open sessions"></nav>
      <div id="agents-strip" class="agents-strip hidden" aria-label="active sub-agents">
        <span class="strip-label">agents</span>
        <div id="agents-chips" class="chips"></div>
        <div class="strip-actions">
          <button id="agents-cancel-btn" type="button" class="strip-btn danger hidden" aria-label="interrupt claude and stop running agents">
            <span class="strip-btn-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="10" height="10" rx="1.5"/>
              </svg>
            </span>
            cancel
          </button>
          <button id="agents-clear-btn" type="button" class="strip-btn hidden" aria-label="dismiss finished agents" title="clear finished">× clear</button>
        </div>
      </div>
      <div id="agents-drawer" class="agents-drawer hidden" aria-live="polite"></div>
      <header id="header">
        <div class="header-left">
          <span id="model-badge" class="badge model" title="Active model (most recent assistant record)">
            <span class="k">model</span> <span id="model-name">—</span>
          </span>
        </div>
        <div class="header-right">
          <button id="flash-toggle" type="button" class="sidebar-toggle-btn bell-btn" aria-label="toggle taskbar flash when Claude is waiting" aria-pressed="true">
            <span class="bell-wrap" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8" />
                <path d="M10.3 20a2 2 0 0 0 3.4 0" />
              </svg>
            </span>
          </button>
          <button id="sidebar-toggle" type="button" class="sidebar-toggle-btn" aria-label="toggle sidebar" aria-pressed="false">›</button>
          <span id="totals" class="totals">
            <span class="badge"><span class="k">in</span> <span id="tot-in">0</span></span>
            <span class="badge"><span class="k">out</span> <span id="tot-out">0</span></span>
            <span class="badge"><span class="k">cache r</span> <span id="tot-cache-r">0</span></span>
            <span class="badge"><span class="k">cache w</span> <span id="tot-cache-w">0</span></span>
            <span class="badge sum" title="Raw sum: in + out + cache_r + cache_w"><span class="k">raw</span> <span id="tot-raw">0</span></span>
            <span class="badge sum" title="Weighted: in×1 + out×5 + cache_r×0.1 + cache_w×1.25 (input-equivalent tokens)"><span class="k">weighted</span> <span id="tot-weighted">0</span></span>
            <span class="badge sum"><span class="k">context</span> <span id="tot-ctx">0</span></span>
          </span>
        </div>
      </header>

      <main id="main">
        <div id="left-col">
          <section id="chat">
            <div id="status" class="status hidden"></div>
            <div id="empty-state" class="empty-state hidden">
              <div class="empty-title">No session open</div>
              <div class="empty-subtitle">Pick a working directory to start a claude session.</div>
              <button id="empty-pick" type="button" class="empty-pick">Pick directory…</button>
            </div>
            <ol id="messages" class="messages"></ol>
          </section>

          <section id="pty-strip-wrap" class="pty-strip-wrap collapsed">
            <div id="pty-toggle" class="pty-toggle" role="separator" aria-orientation="horizontal" aria-label="drag to resize chat input">
              <button id="pty-toggle-label" type="button" class="pty-toggle-label" aria-label="toggle pty output">
                <span class="pty-toggle-chevron"></span>
                <span>terminal</span>
              </button>
              <span class="pty-toggle-divider" aria-hidden="true"></span>
              <span id="thinking-seconds" class="thinking-seconds hidden" aria-label="seconds claude has been thinking on the current turn"></span>
            </div>
            <div id="pty-term" class="pty-term" aria-label="pty terminal"></div>
          </section>

          <div id="prompt-banner" class="prompt-banner hidden" role="region" aria-label="claude code prompt"></div>
        </div>
        <aside id="sidebar" class="sidebar">
          <div id="usage-meters" class="usage-meters" data-variant="bars" aria-label="quota usage">
            <div class="usage-header">
              <span id="usage-title" class="usage-title" role="button" tabindex="0" aria-expanded="true" aria-controls="usage-body">usage</span>
              <span class="usage-header-btns">
                <button id="usage-refresh-btn" type="button" class="usage-mini-btn" aria-label="refresh usage now">↻</button>
                <button id="usage-credits-toggle" type="button" class="usage-mini-btn" aria-label="toggle credits meter">$</button>
                <button id="usage-variant-toggle" type="button" class="usage-mini-btn" aria-label="toggle between bar and ring meter styles">⇋</button>
              </span>
            </div>
            <div id="usage-body" class="usage-body"></div>
          </div>
          <div class="sidebar-search">
            <input type="search" id="sidebar-search" placeholder="search notes…" />
          </div>
          <div id="sidebar-list" class="sidebar-list"></div>
        </aside>
        <footer id="composer">
          <textarea id="input" rows="3" placeholder="message Claude Code (Enter to send · Shift+Enter for newline · Ctrl+C to interrupt · Esc to cancel)"></textarea>
        </footer>
      </main>

      <div id="toasts" class="toasts"></div>
    </div>
    <script src="vendor/xterm/xterm.min.js"></script>
    <script src="vendor/xterm/addon-fit.min.js"></script>
    <script src="prompt_detector.js"></script>
    <script src="app.js"></script>
  </body>
</html>
