extends = "existence"
message = "Epigram contrast '%s': the negated half exists only to make the positive half sound considered. Cut it."
summary = "No 'X is a Y, not a Z' epigrams."
level = "suggestion"
scope = ["sentence"]
ignorecase = true
raw = [
  '\b(?:is|are|was|were|reads?\s+as|stays?|remains?|becomes?)\s+(?:a\s+|an\s+|the\s+)?[\w\x27-]+(?:\s+[\w\x27-]+){0,2},\s+not\s+(?:a\s+|an\s+|the\s+)?[\w\x27-]+',
]
why = """"The table is a ledger, not a cache." The shape sounds like a conclusion and
carries none: if the first half is true the second adds nothing. Suggestion
level because the same shape is sometimes a real correction of a real
misreading, which only a reader can tell."""
credit = "adapted from vale-ai-tells EpigramContrast (MIT)"
