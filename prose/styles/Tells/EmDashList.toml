extends = "density"
message = "Em-dashes in list items: %s in %s words, allowed %s (one per %s words). Bullets tolerate a label dash; a chain of them is prose wearing a bullet."
summary = "Em-dashes in bullets: one as a label separator is fine, a chain of them is not."
level = "suggestion"
scope = ["list"]
token = "—"
per_words = 100
rate = 2.0
floor = 3
why = """The first measurement of the paragraph rule against a corpus of notes flagged
most of them on dashes that were list-item label separators ("Ownership — moves
to the platform group"). Those are structural, so list items get their own budget
at twice the paragraph rate with a floor of three, and only as a suggestion. What
this still catches is a bullet that is really a paragraph chained together with
dashes."""
